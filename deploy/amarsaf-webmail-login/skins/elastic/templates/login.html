<roundcube:include file="includes/layout.html" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="skins/elastic/styles/amarsaf-login.css">

<h1 class="voice"><roundcube:object name="productname" /> <roundcube:label name="login" /></h1>

<div id="layout-content" class="selected no-navbar" role="main">
  <div class="amarsaf-auth-page">
    <div class="amarsaf-auth-bg" aria-hidden="true">
      <div class="amarsaf-auth-bg__orb amarsaf-auth-bg__orb--one"></div>
      <div class="amarsaf-auth-bg__orb amarsaf-auth-bg__orb--two"></div>
      <div class="amarsaf-auth-bg__pattern"></div>
    </div>

    <section class="amarsaf-auth-shell" aria-label="Sign in">
      <div class="amarsaf-auth-card">
        <div class="amarsaf-auth-brand">
          <img
            class="amarsaf-auth-brand__logo"
            src="skins/elastic/images/saf-logo-white.svg"
            alt="SAF"
            width="112"
            height="37"
          />
        </div>

        <div class="amarsaf-auth-card__copy">
          <h2>Sign in</h2>
          <p>Access your mailbox</p>
        </div>

        <roundcube:form id="login-form" name="login-form" method="post" class="propform">
          <roundcube:object name="loginform" form="login-form" size="40" submit=true class="form-control" />
          <div id="login-footer" role="contentinfo" hidden>
            <roundcube:object name="productname" condition="config:display_product_info &gt; 0" />
            <roundcube:container name="loginfooter" id="login-footer" />
          </div>
        </form>
      </div>
    </section>
  </div>
</div>

<noscript>
  <p class="noscriptwarning"><roundcube:label name="noscriptwarning" /></p>
</noscript>

<script>
(function () {
  var FIELD_H = '48px';

  function fieldStyle(insidePasswordWrap) {
    if (insidePasswordWrap) {
      return {
        boxSizing: 'border-box',
        display: 'block',
        flex: '1 1 auto',
        width: 'auto',
        minWidth: '0',
        height: '100%',
        minHeight: '0',
        maxHeight: 'none',
        margin: '0',
        padding: '0 12px',
        borderRadius: '0',
        border: '0',
        background: 'transparent',
        color: '#fff',
        boxShadow: 'none',
        fontSize: '15px',
        lineHeight: 'normal',
        textAlign: 'left'
      };
    }
    return {
      boxSizing: 'border-box',
      display: 'block',
      width: '100%',
      height: FIELD_H,
      minHeight: FIELD_H,
      maxHeight: FIELD_H,
      margin: '0',
      padding: '0 16px',
      borderRadius: '12px',
      border: '1px solid rgba(255,255,255,0.2)',
      background: 'rgba(255,255,255,0.1)',
      color: '#fff',
      boxShadow: 'none',
      fontSize: '15px',
      lineHeight: 'normal',
      textAlign: 'left',
      flex: 'none'
    };
  }

  function applyStyles(el, styles) {
    if (!el) return;
    Object.keys(styles).forEach(function (key) {
      el.style[key] = styles[key];
    });
  }

  function stripRoundcubeChrome(input) {
    if (!input) return;
    var cell = input.closest('td.input') || input.parentElement;
    if (!cell) return;

    cell.querySelectorAll('.input-group-prepend, .input-group-append, .input-group-text, i.icon')
      .forEach(function (el) { el.remove(); });

    cell.classList.remove('input-group', 'input-group-lg', 'form-group', 'row');
    cell.classList.add('input');

    var wrap = cell.querySelector('.amarsaf-password-wrap');
    if (!(wrap && wrap.contains(input)) && input.parentElement !== cell) {
      cell.appendChild(input);
    }

    input.classList.remove('input-group-lg');
    input.removeAttribute('placeholder');
    return cell;
  }

  function ensureToggle(passInput, cell) {
    if (!passInput || !cell) return;
    cell.classList.add('amarsaf-password-cell');
    applyStyles(cell, {
      position: 'static',
      display: 'block',
      height: FIELD_H,
      minHeight: FIELD_H,
      maxHeight: FIELD_H,
      overflow: 'visible',
      padding: '0'
    });

    var wrap = cell.querySelector('.amarsaf-password-wrap');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.className = 'amarsaf-password-wrap';
      cell.appendChild(wrap);
    }
    if (passInput.parentElement !== wrap) {
      wrap.appendChild(passInput);
    }

    applyStyles(wrap, {
      position: 'relative',
      display: 'flex',
      flexDirection: 'row',
      alignItems: 'center',
      width: '100%',
      height: FIELD_H,
      minHeight: FIELD_H,
      maxHeight: FIELD_H,
      margin: '0',
      padding: '0 6px 0 0',
      overflow: 'hidden',
      borderRadius: '12px',
      border: '1px solid rgba(255,255,255,0.2)',
      background: 'rgba(255,255,255,0.1)',
      boxSizing: 'border-box'
    });

    var toggle = wrap.querySelector('.amarsaf-password-toggle');
    if (!toggle) {
      toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'amarsaf-password-toggle';
      toggle.setAttribute('aria-label', 'Show password');
      toggle.setAttribute('tabindex', '-1');
      toggle.textContent = 'Show';
      toggle.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        var reveal = passInput.type === 'password';
        passInput.type = reveal ? 'text' : 'password';
        toggle.textContent = reveal ? 'Hide' : 'Show';
        toggle.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
        passInput.focus();
      });
      wrap.appendChild(toggle);
    }

    applyStyles(toggle, {
      position: 'static',
      top: 'auto',
      right: 'auto',
      bottom: 'auto',
      left: 'auto',
      flex: '0 0 auto',
      alignSelf: 'center',
      width: '64px',
      height: '34px',
      minHeight: '34px',
      maxHeight: '34px',
      margin: '0',
      padding: '0 10px',
      border: '1px solid rgba(255,255,255,0.28)',
      borderRadius: '8px',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      background: 'rgba(109,43,213,0.55)',
      color: '#fff',
      fontSize: '13px',
      fontWeight: '800',
      lineHeight: '1',
      textAlign: 'center',
      cursor: 'pointer',
      zIndex: '5',
      transform: 'none',
      float: 'none',
      verticalAlign: 'middle'
    });
  }

  function normalize() {
    var userInput = document.getElementById('rcmloginuser');
    var passInput = document.getElementById('rcmloginpwd');
    var submit = document.getElementById('rcmloginsubmit');

    document.querySelectorAll('#login-form td.title').forEach(function (td) {
      td.style.display = 'block';
      td.style.padding = '0 0 20px';
      td.style.margin = '0';
      var label = td.querySelector('label');
      if (label) {
        label.style.display = 'block';
        label.style.margin = '0';
        label.style.padding = '0';
        label.style.lineHeight = '1.3';
      }
    });
    document.querySelectorAll('#login-form tr').forEach(function (tr, index) {
      tr.classList.remove('form-group', 'row');
      tr.style.display = 'block';
      tr.style.margin = index === 0 ? '0' : '40px 0 0';
    });

    var userCell = stripRoundcubeChrome(userInput);
    var passCell = stripRoundcubeChrome(passInput);

    if (userCell) {
      applyStyles(userCell, {
        position: 'relative',
        display: 'block',
        height: FIELD_H,
        minHeight: FIELD_H,
        maxHeight: FIELD_H,
        padding: '0'
      });
    }

    applyStyles(userInput, fieldStyle(false));
    ensureToggle(passInput, passCell);
    applyStyles(passInput, fieldStyle(true));

    if (submit) {
      submit.textContent = 'Sign in';
      submit.classList.remove('btn-lg', 'text-uppercase');
      applyStyles(submit, {
        height: FIELD_H,
        minHeight: FIELD_H,
        maxHeight: FIELD_H,
        padding: '0',
        fontSize: '14px',
        lineHeight: '1',
        textTransform: 'none'
      });
    }
  }

  function boot() {
    normalize();
    [50, 150, 400, 1000, 2000, 3000].forEach(function (ms) {
      setTimeout(normalize, ms);
    });
    if (window.rcmail && typeof rcmail.addEventListener === 'function') {
      rcmail.addEventListener('init', normalize);
    }
    // Keep killing Roundcube button translateY if it comes back
    var form = document.getElementById('login-form');
    if (form && window.MutationObserver) {
      var obs = new MutationObserver(function () {
        var toggle = document.querySelector('.amarsaf-password-toggle');
        if (toggle) {
          toggle.style.transform = 'none';
        }
      });
      obs.observe(form, { attributes: true, subtree: true, attributeFilter: ['style', 'class'] });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
