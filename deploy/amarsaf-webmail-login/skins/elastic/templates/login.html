<roundcube:include file="includes/layout.html" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="skins/elastic/styles/amarsaf-login.css">

<h1 class="voice"><roundcube:object name="productname" /> <roundcube:label name="login" /></h1>

<div id="layout-content" class="selected no-navbar" role="main">
  <div class="amarsaf-auth-page">
    <section class="amarsaf-auth-panel amarsaf-auth-panel--login" aria-label="Sign in">
      <div class="amarsaf-auth-brand">
        <img
          class="amarsaf-auth-brand__logo"
          src="skins/elastic/images/saf-logo-white.svg"
          alt="SAF"
          width="112"
          height="37"
        />
      </div>

      <div class="amarsaf-auth-card">
        <div class="amarsaf-auth-card__copy">
          <h2>Sign in</h2>
          <p>Access your mailbox</p>
        </div>

        <roundcube:form id="login-form" name="login-form" method="post" class="propform">
          <roundcube:object name="loginform" form="login-form" size="40" submit=true class="form-control" />
          <div id="login-footer" role="contentinfo" hidden>
            <roundcube:object name="productname" condition="config:display_product_info &gt; 0" />
            <roundcube:container name="loginfooter" id="login-footer" />
          </div>
        </form>
      </div>
    </section>

    <section class="amarsaf-auth-panel amarsaf-auth-panel--visual" aria-hidden="true">
      <div class="amarsaf-auth-visual">
        <div class="amarsaf-auth-visual__orb amarsaf-auth-visual__orb--one"></div>
        <div class="amarsaf-auth-visual__orb amarsaf-auth-visual__orb--two"></div>
        <div class="amarsaf-auth-visual__pattern"></div>
        <div class="amarsaf-auth-visual__content">
          <img
            class="amarsaf-auth-visual__mark"
            src="skins/elastic/images/saf-logomark.svg"
            alt=""
            width="56"
            height="56"
          />
          <p class="amarsaf-auth-visual__title">SAF</p>
          <p class="amarsaf-auth-visual__line">Clarity in every drop.</p>
        </div>
      </div>
    </section>
  </div>
</div>

<noscript>
  <p class="noscriptwarning"><roundcube:label name="noscriptwarning" /></p>
</noscript>

<script>
(function () {
  var FIELD_H = '40px';

  function fieldStyle(extraPaddingRight) {
    return {
      boxSizing: 'border-box',
      display: 'block',
      width: '100%',
      height: FIELD_H,
      minHeight: FIELD_H,
      maxHeight: FIELD_H,
      margin: '0',
      padding: extraPaddingRight ? '0 56px 0 12px' : '0 12px',
      borderRadius: '10px',
      border: '1px solid rgba(255,255,255,0.12)',
      background: 'rgba(255,255,255,0.03)',
      color: '#fff',
      boxShadow: 'none',
      fontSize: '14px',
      lineHeight: 'normal',
      flex: 'none'
    };
  }

  function applyStyles(el, styles) {
    if (!el) return;
    Object.keys(styles).forEach(function (key) {
      el.style[key] = styles[key];
    });
  }

  function stripRoundcubeChrome(input) {
    if (!input) return;
    var cell = input.closest('td.input') || input.parentElement;
    if (!cell) return;

    cell.querySelectorAll('.input-group-prepend, .input-group-append, .input-group-text, i.icon')
      .forEach(function (el) { el.remove(); });

    cell.classList.remove('input-group', 'input-group-lg', 'form-group', 'row');
    cell.classList.add('input');

    var wrap = cell.querySelector('.amarsaf-password-wrap');
    if (wrap && wrap.contains(input)) {
      // keep wrap
    } else if (input.parentElement !== cell) {
      cell.appendChild(input);
    }

    input.classList.remove('input-group-lg');
    input.removeAttribute('placeholder');
    return cell;
  }

  function ensureToggle(passInput, cell) {
    if (!passInput || !cell) return;
    cell.classList.add('amarsaf-password-cell');
    applyStyles(cell, {
      position: 'static',
      display: 'block',
      height: FIELD_H,
      minHeight: FIELD_H,
      maxHeight: FIELD_H,
      overflow: 'visible',
      padding: '0'
    });

    var wrap = cell.querySelector('.amarsaf-password-wrap');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.className = 'amarsaf-password-wrap';
      cell.appendChild(wrap);
    }
    if (passInput.parentElement !== wrap) {
      wrap.appendChild(passInput);
    }

    applyStyles(wrap, {
      position: 'relative',
      display: 'block',
      width: '100%',
      height: FIELD_H,
      minHeight: FIELD_H,
      maxHeight: FIELD_H,
      margin: '0',
      padding: '0',
      overflow: 'hidden'
    });

    var toggle = wrap.querySelector('.amarsaf-password-toggle');
    if (!toggle) {
      toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'amarsaf-password-toggle';
      toggle.setAttribute('aria-label', 'Show password');
      toggle.setAttribute('tabindex', '-1');
      toggle.textContent = 'Show';
      toggle.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        var reveal = passInput.type === 'password';
        passInput.type = reveal ? 'text' : 'password';
        toggle.textContent = reveal ? 'Hide' : 'Show';
        toggle.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
        passInput.focus();
      });
      wrap.appendChild(toggle);
    }

    applyStyles(toggle, {
      position: 'absolute',
      top: '0',
      right: '0',
      width: '52px',
      height: FIELD_H,
      minHeight: FIELD_H,
      maxHeight: FIELD_H,
      margin: '0',
      padding: '0',
      border: '0',
      background: 'transparent',
      color: 'rgba(255,255,255,0.55)',
      fontSize: '11px',
      fontWeight: '700',
      lineHeight: FIELD_H,
      textAlign: 'center',
      cursor: 'pointer',
      zIndex: '5'
    });
  }

  function normalize() {
    var userInput = document.getElementById('rcmloginuser');
    var passInput = document.getElementById('rcmloginpwd');
    var submit = document.getElementById('rcmloginsubmit');

    document.querySelectorAll('#login-form td.title').forEach(function (td) {
      td.style.display = 'block';
      td.style.paddingBottom = '6px';
    });
    document.querySelectorAll('#login-form tr').forEach(function (tr) {
      tr.classList.remove('form-group', 'row');
      tr.style.display = 'block';
    });

    var userCell = stripRoundcubeChrome(userInput);
    var passCell = stripRoundcubeChrome(passInput);

    if (userCell) {
      applyStyles(userCell, {
        position: 'relative',
        display: 'block',
        height: FIELD_H,
        minHeight: FIELD_H,
        maxHeight: FIELD_H,
        padding: '0'
      });
    }

    applyStyles(userInput, fieldStyle(false));
    applyStyles(passInput, fieldStyle(true));
    ensureToggle(passInput, passCell);

    if (submit) {
      submit.textContent = 'Sign in';
      submit.classList.remove('btn-lg', 'text-uppercase');
      applyStyles(submit, {
        height: FIELD_H,
        minHeight: FIELD_H,
        maxHeight: FIELD_H,
        padding: '0',
        fontSize: '14px',
        lineHeight: '1',
        textTransform: 'none'
      });
    }
  }

  function boot() {
    normalize();
    // Roundcube elastic wraps fields in input-group-lg after init — undo that.
    [50, 150, 400, 1000].forEach(function (ms) {
      setTimeout(normalize, ms);
    });
    if (window.rcmail && typeof rcmail.addEventListener === 'function') {
      rcmail.addEventListener('init', normalize);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
