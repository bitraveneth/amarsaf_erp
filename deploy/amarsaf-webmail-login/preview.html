<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAF Webmail — login preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="skins/elastic/styles/amarsaf-login.css">
  <style>html, body { margin: 0; min-height: 100%; }</style>
</head>
<body class="task-login">
  <div id="layout">
    <div id="layout-content" class="selected no-navbar" role="main">
      <div class="amarsaf-auth-page">
        <div class="amarsaf-auth-bg" aria-hidden="true">
          <div class="amarsaf-auth-bg__orb amarsaf-auth-bg__orb--one"></div>
          <div class="amarsaf-auth-bg__orb amarsaf-auth-bg__orb--two"></div>
          <div class="amarsaf-auth-bg__pattern"></div>
        </div>

        <section class="amarsaf-auth-shell" aria-label="Sign in">
          <div class="amarsaf-auth-card">
            <div class="amarsaf-auth-brand">
              <img
                class="amarsaf-auth-brand__logo"
                src="skins/elastic/images/saf-logo-white.svg"
                alt="SAF"
                width="112"
                height="37"
              />
            </div>

            <div class="amarsaf-auth-card__copy">
              <h2>Sign in</h2>
              <p>Access your mailbox</p>
            </div>

            <form id="login-form" name="login-form" method="post" class="propform">
              <table>
                <tr>
                  <td class="title"><label for="rcmloginuser">Username</label></td>
                  <td class="input">
                    <input name="_user" id="rcmloginuser" class="form-control" type="text" value="name@amarsaf.com" />
                  </td>
                </tr>
                <tr>
                  <td class="title"><label for="rcmloginpwd">Password</label></td>
                  <td class="input">
                    <input name="_pass" id="rcmloginpwd" class="form-control" type="password" value="password123" />
                  </td>
                </tr>
              </table>
              <p class="formbuttons">
                <button type="submit" id="rcmloginsubmit" class="button mainaction">Sign in</button>
              </p>
            </form>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    const passInput = document.getElementById('rcmloginpwd');
    if (!passInput) return;
    const cell = passInput.closest('td.input') || passInput.parentElement;
    cell.classList.add('amarsaf-password-cell');
    let wrap = cell.querySelector('.amarsaf-password-wrap');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.className = 'amarsaf-password-wrap';
      cell.appendChild(wrap);
    }
    wrap.appendChild(passInput);
    if (!wrap.querySelector('.amarsaf-password-toggle')) {
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'amarsaf-password-toggle';
      toggle.textContent = 'Show';
      toggle.addEventListener('click', function (event) {
        event.preventDefault();
        const reveal = passInput.type === 'password';
        passInput.type = reveal ? 'text' : 'password';
        toggle.textContent = reveal ? 'Hide' : 'Show';
      });
      wrap.appendChild(toggle);
    }
  });
  </script>
</body>
</html>
