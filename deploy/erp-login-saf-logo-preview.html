<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAF ERP — sign in preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #6d2bd5;
      --brand-deep: #4b2cd7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Outfit, system-ui, sans-serif;
      color: #111827;
      background: #f3f0fa;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      position: relative;
      overflow: hidden;
    }
    body::before, body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
    }
    body::before {
      width: 420px; height: 420px;
      top: -120px; right: -80px;
      background: radial-gradient(circle, rgba(109,43,213,.28), transparent 70%);
    }
    body::after {
      width: 360px; height: 360px;
      bottom: -100px; left: -80px;
      background: radial-gradient(circle, rgba(75,44,215,.18), transparent 70%);
    }
    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 420px);
      padding: 40px 36px 32px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 28px 80px rgba(20, 8, 46, 0.12);
      border: 1px solid rgba(17, 24, 39, 0.06);
    }
    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    .brand img {
      height: 72px;
      width: auto;
      max-width: 72%;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.04em;
      font-weight: 800;
      text-align: center;
    }
    .sub {
      margin: 0 0 28px;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.45;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }
    .field { margin-bottom: 18px; }
    input {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      padding: 0 14px;
      font: inherit;
      font-size: 15px;
      background: #fafafa;
    }
    button.submit {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--brand), var(--brand-deep));
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(109, 43, 213, 0.28);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="../public/images/brand/saf-logo-light.svg" alt="SAF" />
    </div>
    <h1>Welcome back</h1>
    <p class="sub">Enter your email and password to access your admin panel.</p>
    <div class="field">
      <label>Email</label>
      <input type="email" value="admin@saferpv.local" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" value="password" />
    </div>
    <button class="submit" type="button">Log in</button>
  </div>
</body>
</html>
