<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="ERP dashboard preview">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f7ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5F4BFF"/>
      <stop offset="100%" stop-color="#8B7CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="320" cy="250" rx="220" ry="140" fill="#ffffff" opacity="0.12"/>

  <!-- back card -->
  <g transform="translate(88 72) rotate(-6)" filter="url(#shadow)">
    <rect width="280" height="190" rx="18" fill="url(#card)" opacity="0.92"/>
    <rect x="20" y="20" width="72" height="10" rx="5" fill="#E5E7EB"/>
    <rect x="20" y="42" width="120" height="8" rx="4" fill="#F3F4F6"/>
    <rect x="20" y="78" width="56" height="56" rx="10" fill="#F5F3FF"/>
    <rect x="88" y="78" width="56" height="56" rx="10" fill="#F5F3FF"/>
    <rect x="156" y="78" width="104" height="56" rx="10" fill="#F5F3FF"/>
    <rect x="20" y="148" width="240" height="22" rx="6" fill="#F9FAFB"/>
  </g>

  <!-- main card -->
  <g transform="translate(148 118)" filter="url(#shadow)">
    <rect width="360" height="250" rx="22" fill="url(#card)"/>

    <!-- top bar -->
    <circle cx="28" cy="28" r="6" fill="#5F4BFF"/>
    <rect x="44" y="22" width="88" height="12" rx="6" fill="#111827" opacity="0.85"/>
    <rect x="250" y="20" width="82" height="16" rx="8" fill="#5F4BFF" opacity="0.12"/>
    <rect x="262" y="25" width="58" height="6" rx="3" fill="#5F4BFF"/>

    <!-- stat cards -->
    <g transform="translate(24 56)">
      <rect width="96" height="72" rx="14" fill="#F8F7FF" stroke="#ECE9FF"/>
      <text x="14" y="22" fill="#6B7280" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Net sales</text>
      <text x="14" y="46" fill="#111827" font-family="system-ui,sans-serif" font-size="18" font-weight="700">ó 45.9M</text>
      <text x="14" y="62" fill="#059669" font-family="system-ui,sans-serif" font-size="10" font-weight="700">+12.4%</text>
    </g>
    <g transform="translate(132 56)">
      <rect width="96" height="72" rx="14" fill="#F8F7FF" stroke="#ECE9FF"/>
      <text x="14" y="22" fill="#6B7280" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Open AR</text>
      <text x="14" y="46" fill="#111827" font-family="system-ui,sans-serif" font-size="18" font-weight="700">ó 52.8M</text>
      <text x="14" y="62" fill="#D97706" font-family="system-ui,sans-serif" font-size="10" font-weight="700">18 overdue</text>
    </g>
    <g transform="translate(240 56)">
      <rect width="96" height="72" rx="14" fill="#F8F7FF" stroke="#ECE9FF"/>
      <text x="14" y="22" fill="#6B7280" font-family="system-ui,sans-serif" font-size="10" font-weight="600">Production</text>
      <text x="14" y="46" fill="#111827" font-family="system-ui,sans-serif" font-size="18" font-weight="700">1,240</text>
      <text x="58" y="46" fill="#6B7280" font-family="system-ui,sans-serif" font-size="10" font-weight="600">units</text>
    </g>

    <!-- chart area -->
    <rect x="24" y="142" width="200" height="88" rx="14" fill="#FAFAFF" stroke="#ECE9FF"/>
    <polyline points="44,206 72,184 98,192 124,168 152,176 178,150 204,158" stroke="#5F4BFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="204" cy="158" r="4" fill="#5F4BFF"/>

    <!-- donut -->
    <g transform="translate(248 142)">
      <rect width="88" height="88" rx="14" fill="#FAFAFF" stroke="#ECE9FF"/>
      <circle cx="44" cy="44" r="24" stroke="#E5E7EB" stroke-width="8"/>
      <circle cx="44" cy="44" r="24" stroke="#5F4BFF" stroke-width="8" stroke-dasharray="108 42" transform="rotate(-90 44 44)"/>
      <text x="44" y="48" text-anchor="middle" fill="#374151" font-family="system-ui,sans-serif" font-size="11" font-weight="700">72%</text>
    </g>

    <!-- table rows -->
    <rect x="24" y="238" width="312" height="1" fill="#F3F4F6"/>
    <rect x="24" y="248" width="48" height="6" rx="3" fill="#D1D5DB"/>
    <rect x="92" y="248" width="72" height="6" rx="3" fill="#E5E7EB"/>
    <rect x="188" y="248" width="52" height="6" rx="3" fill="#E5E7EB"/>
    <rect x="268" y="246" width="44" height="10" rx="5" fill="#ECFDF5"/>
    <rect x="276" y="249" width="28" height="4" rx="2" fill="#059669"/>
  </g>

  <!-- floating accent chips -->
  <g filter="url(#glow)">
    <rect x="48" y="318" width="118" height="34" rx="17" fill="#ffffff" opacity="0.95"/>
    <circle cx="68" cy="335" r="8" fill="#5F4BFF" opacity="0.15"/>
    <circle cx="68" cy="335" r="4" fill="#5F4BFF"/>
    <text x="84" y="339" fill="#111827" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Orders &amp; agents</text>
  </g>
  <g filter="url(#glow)">
    <rect x="430" y="88" width="128" height="34" rx="17" fill="#ffffff" opacity="0.95"/>
    <circle cx="450" cy="105" r="8" fill="#5F4BFF" opacity="0.15"/>
    <circle cx="450" cy="105" r="4" fill="#5F4BFF"/>
    <text x="466" y="109" fill="#111827" font-family="system-ui,sans-serif" font-size="11" font-weight="600">VAT &amp; ledgers</text>
  </g>
</svg>
