name: Deploy to VPS

on:
  push:
    branches:
      - test
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          DEPLOY_BRANCH: test
        run: |
          ssh "$VPS_USER@$VPS_HOST" "bash -se" <<EOF
            set -Eeuo pipefail

            APP_DOWN=0
            cleanup() {
              if [ "\$APP_DOWN" -eq 1 ]; then
                php artisan up || true
              fi
            }
            trap cleanup EXIT

            cd "$VPS_PATH"

            # Ensure Laravel scheduler cron exists (idempotent)
            CRON_MARKER="# saferpv1-laravel-scheduler"
            CRON_ENTRY="* * * * * cd \"$VPS_PATH\" && php artisan schedule:run >> /dev/null 2>&1 $CRON_MARKER"
            ( crontab -l 2>/dev/null | grep -v "$CRON_MARKER" || true; echo "$CRON_ENTRY" ) | crontab -

            # Ensure .env exists (first deploy only)
            if [ ! -f .env ] && [ -f .env.example ]; then
                cp .env.example .env
            fi

            # Ensure APP_KEY exists once
            if [ -f .env ] && ( ! grep -q '^APP_KEY=' .env || grep -q '^APP_KEY=$' .env ); then
              php artisan key:generate --force
            fi

            # Enforce non-debug runtime on server
            if [ -f .env ]; then
              if grep -q '^APP_DEBUG=' .env; then
                sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
              else
                echo 'APP_DEBUG=false' >> .env
              fi
            fi

            # Pull latest code safely (no hard reset, no data loss)
            git fetch --prune origin
            git checkout "$DEPLOY_BRANCH"
            git pull --ff-only origin "$DEPLOY_BRANCH"

            # PHP dependencies for production
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # Frontend build (Vite is a devDependency)
            if command -v npm >/dev/null 2>&1; then
              if [ -f package-lock.json ]; then
                npm ci --include=dev
              else
                npm install --include=dev
              fi
              npm run build
              npm prune --omit=dev
            else
              echo "npm not found on server - skipping frontend build"
            fi

            # Keep downtime short: only around migration/cache swap
            php artisan down --retry=60 || true
            APP_DOWN=1

            # Safe incremental migration (no fresh/wipe)
            php artisan migrate --force

            # Cache refresh
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Storage link (idempotent)
            php artisan storage:link || true

            # Runtime directory permissions
            if command -v sudo >/dev/null 2>&1; then
              sudo chown -R www-data:www-data storage bootstrap/cache || true
            else
              chown -R www-data:www-data storage bootstrap/cache || true
            fi
            find storage -type d -exec chmod 775 {} \\; || true
            find storage -type f -exec chmod 664 {} \\; || true
            find bootstrap/cache -type d -exec chmod 775 {} \\; || true
            find bootstrap/cache -type f -exec chmod 664 {} \\; || true

            php artisan up
            APP_DOWN=0
          EOF
