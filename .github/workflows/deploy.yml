name: Deploy to VPS

on:
  push:
    branches:
      - test  # deploy from test branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" << EOF
            set -euo pipefail

            cd "${{ secrets.VPS_PATH }}"

            # Ensure .env exists (first deploy)
            if [ ! -f .env ]; then
              cp .env.example .env || true
            fi

            # Ensure APP_KEY is set once
            if ! grep -q '^APP_KEY=' .env || grep -q '^APP_KEY=$' .env; then
              echo "APP_KEY missing or empty – generating..."
              php artisan key:generate --force
            fi

            # Maintenance mode during deploy
            php artisan down || true

            # Pull latest code for test branch
            git fetch origin
            git checkout test
            git pull origin test

            # PHP dependencies (optimized, no dev)
            if command -v composer >/dev/null 2>&1; then
              composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            else
              echo "Composer not found on server"; exit 1
            fi

            # Incremental migrations
            php artisan migrate --force

            # Frontend build – include devDependencies because Vite is a dev dependency
            if command -v npm >/dev/null 2>&1; then
              if [ -f package-lock.json ]; then
                npm ci --include=dev
              else
                npm install --include=dev
              fi
              npm run build
            else
              echo "npm not found on server – skipping asset build"
            fi

            # Ensure storage and cache directories are writable for Apache (www-data)
            chown -R www-data:www-data storage bootstrap/cache || true
            find storage -type d -exec chmod 775 {} \\; || true
            find storage -type f -exec chmod 664 {} \\; || true
            find bootstrap/cache -type d -exec chmod 775 {} \\; || true
            find bootstrap/cache -type f -exec chmod 664 {} \\; || true

            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:clear

            php artisan up
          EOF
